# This repository presents Delta MCP: there is no code in it. Questions and ideas go to Discussions; issues are for a problem on the
# website or in the docs; security problems go to a private address.
blank_issues_enabled: true
contact_links:
  - name: Ask a question
    url: https://github.com/mcpdelta/mcpdelta/discussions/new?category=q-a
    about: Questions about Delta MCP, answered by us and by other people. The usual ones are in the FAQ on https://www.mcpdelta.com/docs/faq.
  - name: Share an idea
    url: https://github.com/mcpdelta/mcpdelta/discussions/new?category=ideas
    about: What should Delta MCP check, show or undo? Tell us a real task.
  - name: Report a security problem
    url: https://www.mcpdelta.com/security
    about: Write to contact@mcpdelta.com, privately. Please don't open a public issue.
