name: A problem on the website or in the docs
description: A wrong fact, a broken link, a missing page or a sentence that reads wrong.
title: "[Page] "
body:
  - type: input
    id: page
    attributes:
      label: Page address
      placeholder: https://www.mcpdelta.com/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Please leave out secrets, tokens and other people's data.
    validations:
      required: true
